<!-- Snacky interest picker. Replace every {{PLACEHOLDER}}. {{CHIPS}} = one <button class="chip"> per interest (see SKILL.md). -->
<style>
  .snacky {
    --sn-bg: #faf9f5; --sn-surface: #ffffff; --sn-text: #141413; --sn-muted: #6b6a63;
    --sn-line: #e8e6dc; --sn-accent: #d97757; --sn-accent-soft: #f6e4dc;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--sn-text); max-width: 560px; margin: 8px auto;
  }
  @media (prefers-color-scheme: dark) {
    .snacky {
      --sn-bg: #262624; --sn-surface: #30302e; --sn-text: #faf9f5; --sn-muted: #b0aea5;
      --sn-line: #3e3e3a; --sn-accent: #e08a6d; --sn-accent-soft: #3d2c25;
    }
  }
  .snacky * { box-sizing: border-box; }
  .snacky .ic { flex: none; vertical-align: -3px; }
  .snacky .card { background: var(--sn-surface); border: 1px solid var(--sn-line); border-radius: 16px; overflow: hidden; }
  .snacky .top { padding: 18px 20px 6px; }
  .snacky .kicker { display: flex; align-items: center; gap: 6px; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--sn-muted); }
  .snacky h2 { font-family: ui-serif, Georgia, "Times New Roman", serif; font-weight: 500; font-size: 22px; line-height: 1.25; margin: 6px 0 6px; }
  .snacky .hint { font-size: 14px; color: var(--sn-muted); margin: 0; line-height: 1.5; }
  .snacky .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 14px 20px 18px; }
  .snacky .chip { font: inherit; font-size: 14px; cursor: pointer; border-radius: 999px; padding: 8px 14px; border: 1px solid var(--sn-line); background: var(--sn-bg); color: var(--sn-text); display: inline-flex; align-items: center; gap: 6px; transition: background .15s, border-color .15s; }
  .snacky .chip:hover { border-color: var(--sn-accent); }
  .snacky .chip[aria-pressed="true"] { background: var(--sn-accent-soft); border-color: var(--sn-accent); }
  .snacky .chip .ic { color: var(--sn-accent); }
  .snacky .chip[aria-pressed="true"]::after { content: "✓"; color: var(--sn-accent); font-weight: 700; }
  .snacky .chip .new { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: #fff; background: var(--sn-accent); border-radius: 6px; padding: 2px 5px; }
  .snacky .foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--sn-line); background: var(--sn-bg); }
  .snacky .link { font: inherit; font-size: 13px; cursor: pointer; background: none; border: 0; color: var(--sn-muted); text-decoration: underline; text-underline-offset: 2px; padding: 0; }
  .snacky .go { margin-left: auto; font: inherit; font-size: 14px; cursor: pointer; border-radius: 999px; padding: 9px 18px; border: 1px solid var(--sn-accent); background: var(--sn-accent); color: #fff; }
  .snacky .go:disabled { opacity: .45; cursor: default; }
</style>

<div class="snacky">
  <div class="card">
    <div class="top">
      <div class="kicker"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8a2 2 0 0 0 0-4 2 2 0 0 0-4 0 2 2 0 0 0-4 0 2 2 0 0 0-4 0 2 2 0 0 0 0 4"/><path d="M10 22 9 8"/><path d="m14 22 1-14"/><path d="M20 8c.5 0 .9.4.8 1l-2.6 12c-.1.5-.7 1-1.2 1H7c-.6 0-1.1-.4-1.2-1L3.2 9c-.1-.6.3-1 .8-1Z"/></svg> Snacky</div>
      <h2>{{LABEL_TITLE}}</h2>
      <p class="hint">{{LABEL_HINT}}</p>
    </div>
    <div class="chips">
      {{CHIPS}}
    </div>
    <div class="foot">
      <button class="link" data-all>{{LABEL_SELECT_ALL}}</button>
      <button class="go" data-go disabled>{{LABEL_CONFIRM}} (<span data-count>0</span>)</button>
    </div>
  </div>
</div>

<script>
  var SN_ICONS = {"science":"<path d=\"M10 2v7.527a2 2 0 0 1-.211.896L4.72 20.55a1 1 0 0 0 .9 1.45h12.76a1 1 0 0 0 .9-1.45l-5.069-10.127A2 2 0 0 1 14 9.527V2\"/><path d=\"M8.5 2h7\"/><path d=\"M7 16h10\"/>","space":"<path d=\"M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09z\"/><path d=\"m12 15-3-3a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.35 22.35 0 0 1-4 2z\"/><path d=\"M9 12H4s.55-3.03 2-4c1.62-1.08 5 0 5 0\"/><path d=\"M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5\"/>","history":"<line x1=\"3\" x2=\"21\" y1=\"22\" y2=\"22\"/><line x1=\"6\" x2=\"6\" y1=\"18\" y2=\"11\"/><line x1=\"10\" x2=\"10\" y1=\"18\" y2=\"11\"/><line x1=\"14\" x2=\"14\" y1=\"18\" y2=\"11\"/><line x1=\"18\" x2=\"18\" y1=\"18\" y2=\"11\"/><polygon points=\"12 2 20 7 4 7\"/>","technology":"<rect width=\"16\" height=\"16\" x=\"4\" y=\"4\" rx=\"2\"/><rect width=\"6\" height=\"6\" x=\"9\" y=\"9\" rx=\"1\"/><path d=\"M15 2v2\"/><path d=\"M15 20v2\"/><path d=\"M2 15h2\"/><path d=\"M2 9h2\"/><path d=\"M20 15h2\"/><path d=\"M20 9h2\"/><path d=\"M9 2v2\"/><path d=\"M9 20v2\"/>","health":"<path d=\"M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z\"/><path d=\"M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27\"/>","psychology":"<path d=\"M12 5a3 3 0 1 0-5.997.125 4 4 0 0 0-2.526 5.77 4 4 0 0 0 .556 6.588A4 4 0 1 0 12 18Z\"/><path d=\"M12 5a3 3 0 1 1 5.997.125 4 4 0 0 1 2.526 5.77 4 4 0 0 1-.556 6.588A4 4 0 1 1 12 18Z\"/><path d=\"M15 13a4.5 4.5 0 0 1-3-4 4.5 4.5 0 0 1-3 4\"/><path d=\"M17.599 6.5a3 3 0 0 0 .399-1.375\"/><path d=\"M6.003 5.125A3 3 0 0 0 6.401 6.5\"/><path d=\"M3.477 10.896a4 4 0 0 1 .585-.396\"/><path d=\"M19.938 10.5a4 4 0 0 1 .585.396\"/><path d=\"M6 18a4 4 0 0 1-1.967-.516\"/><path d=\"M19.967 17.484A4 4 0 0 1 18 18\"/>","finance":"<path d=\"M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1\"/><path d=\"M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4\"/>","nature":"<path d=\"M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z\"/><path d=\"M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12\"/>","geography":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20\"/><path d=\"M2 12h20\"/>","art":"<circle cx=\"13.5\" cy=\"6.5\" r=\".5\" fill=\"currentColor\"/><circle cx=\"17.5\" cy=\"10.5\" r=\".5\" fill=\"currentColor\"/><circle cx=\"8.5\" cy=\"7.5\" r=\".5\" fill=\"currentColor\"/><circle cx=\"6.5\" cy=\"12.5\" r=\".5\" fill=\"currentColor\"/><path d=\"M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z\"/>","music":"<path d=\"M9 18V5l12-2v13\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><circle cx=\"18\" cy=\"16\" r=\"3\"/>","sports":"<path d=\"M6 9H4.5a2.5 2.5 0 0 1 0-5H6\"/><path d=\"M18 9h1.5a2.5 2.5 0 0 0 0-5H18\"/><path d=\"M4 22h16\"/><path d=\"M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22\"/><path d=\"M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22\"/><path d=\"M18 2H6v7a6 6 0 0 0 12 0V2Z\"/>","language":"<path d=\"m5 8 6 6\"/><path d=\"m4 14 6-6 2-3\"/><path d=\"M2 5h12\"/><path d=\"M7 2h1\"/><path d=\"m22 22-5-10-5 10\"/><path d=\"M14 18h6\"/>","philosophy":"<path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\"/><path d=\"M12 17h.01\"/>","business":"<path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/><rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\"/>","food":"<path d=\"M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z\"/><path d=\"M6 17h12\"/>","faith":"<path d=\"M12 7v14\"/><path d=\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"/>"};
  document.querySelectorAll('.snacky [data-icon]').forEach(function (el) {
    var p = SN_ICONS[el.getAttribute('data-icon')];
    if (p && !el.querySelector(':scope > svg.ic')) el.insertAdjacentHTML('afterbegin', '<svg class="ic" width="' + (el.getAttribute('data-size') || 16) + '" height="' + (el.getAttribute('data-size') || 16) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>');
  });
  (function () {
    var root = document.currentScript ? document.currentScript.previousElementSibling : document.querySelector('.snacky');
    if (!root || !root.classList.contains('snacky')) root = document.querySelector('.snacky');
    var chips = Array.prototype.slice.call(root.querySelectorAll('.chip'));
    var go = root.querySelector('[data-go]');
    var count = root.querySelector('[data-count]');
    function selected() { return chips.filter(function (c) { return c.getAttribute('aria-pressed') === 'true'; }); }
    function refresh() { var n = selected().length; count.textContent = n; go.disabled = n === 0; }
    chips.forEach(function (c) {
      c.addEventListener('click', function () {
        c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') === 'true' ? 'false' : 'true');
        refresh();
      });
    });
    root.querySelector('[data-all]').addEventListener('click', function () {
      var all = selected().length !== chips.length;
      chips.forEach(function (c) { c.setAttribute('aria-pressed', all ? 'true' : 'false'); });
      refresh();
    });
    go.addEventListener('click', function () {
      var names = selected().map(function (c) { return c.getAttribute('data-label'); });
      var codes = selected().map(function (c) { return c.getAttribute('data-code'); });
      var text = '{{PROMPT_PREFIX}} ' + names.join(', ') + ' [' + codes.join(',') + ']';
      if (typeof window.sendPrompt === 'function') {
        window.sendPrompt(text);
        go.disabled = true;
        chips.forEach(function (c) { c.disabled = true; });
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
        go.textContent = '📋 ' + text;
      }
    });
    refresh();
  })();
</script>
