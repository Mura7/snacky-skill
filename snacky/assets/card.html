<!-- Snacky fact card. Replace every {{PLACEHOLDER}}; delete blocks marked OPTIONAL when not needed. -->
<style>
  .snacky {
    --sn-bg: #faf9f5; --sn-surface: #ffffff; --sn-text: #141413; --sn-muted: #6b6a63;
    --sn-line: #e8e6dc; --sn-accent: #d97757; --sn-accent-soft: #f6e4dc;
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    color: var(--sn-text); max-width: 560px; margin: 8px auto;
  }
  @media (prefers-color-scheme: dark) {
    .snacky {
      --sn-bg: #262624; --sn-surface: #30302e; --sn-text: #faf9f5; --sn-muted: #b0aea5;
      --sn-line: #3e3e3a; --sn-accent: #e08a6d; --sn-accent-soft: #3d2c25;
    }
  }
  .snacky * { box-sizing: border-box; }
  .snacky .ic { flex: none; vertical-align: -3px; }
  .snacky .card { background: var(--sn-surface); border: 1px solid var(--sn-line); border-radius: 16px; overflow: hidden; }
  .snacky .top { display: flex; align-items: center; gap: 10px; padding: 14px 20px; background: var(--sn-bg); border-bottom: 1px solid var(--sn-line); }
  .snacky .emoji { font-size: 22px; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; background: var(--sn-accent-soft); color: var(--sn-accent); }
  .snacky .kicker { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--sn-muted); }
  .snacky .topic { font-size: 14px; font-weight: 600; }
  .snacky .date { margin-left: auto; font-size: 12px; color: var(--sn-muted); white-space: nowrap; }
  .snacky .body { padding: 20px 20px 4px; }
  .snacky h2 { font-family: ui-serif, Georgia, "Times New Roman", serif; font-weight: 500; font-size: 24px; line-height: 1.25; margin: 0 0 12px; }
  .snacky p { font-size: 15px; line-height: 1.6; margin: 0 0 16px; }
  .snacky .why { background: var(--sn-bg); border-left: 3px solid var(--sn-accent); border-radius: 0 10px 10px 0; padding: 12px 14px; font-size: 14px; line-height: 1.55; margin-bottom: 16px; }
  .snacky .why b { color: var(--sn-accent); font-weight: 600; }
  .snacky .src { font-size: 13px; color: var(--sn-muted); padding: 0 20px 18px; }
  .snacky .src a { color: var(--sn-muted); text-decoration: underline; text-underline-offset: 2px; }
  .snacky .foot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 14px 20px; border-top: 1px solid var(--sn-line); background: var(--sn-bg); }
  .snacky button, .snacky .btn { display: inline-flex; align-items: center; gap: 6px; font: inherit; font-size: 13px; cursor: pointer; border-radius: 999px; padding: 8px 14px; border: 1px solid var(--sn-line); background: var(--sn-surface); color: var(--sn-text); text-decoration: none; }
  .snacky button.primary { background: var(--sn-accent); border-color: var(--sn-accent); color: #fff; }
  .snacky .support { display: inline-flex; align-items: center; gap: 5px; margin-left: auto; font-size: 13px; color: var(--sn-muted); text-decoration: none; }
  .snacky .support:hover { color: var(--sn-accent); }
  .snacky .done { font-size: 13px; color: var(--sn-muted); }
  .snacky .news { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 0 20px 16px; padding: 10px 12px; border-radius: 12px; background: var(--sn-accent-soft); font-size: 13px; line-height: 1.45; }
  .snacky .news button { margin-left: auto; }
</style>

<div class="snacky">
  <div class="card">
    <div class="top">
      <div class="emoji" data-icon="{{INTEREST_CODE}}" data-size="20"></div>
      <div>
        <div class="kicker">{{LABEL_FACT_OF_THE_DAY}}</div>
        <div class="topic">{{INTEREST}}</div>
      </div>
      <div class="date">{{DATE}}</div>
    </div>
    <div class="body">
      <h2>{{TITLE}}</h2>
      <p>{{FACT}}</p>
      <div class="why"><b><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-.9 1.5-2.2 1.5-3.5A6 6 0 0 0 6 8c0 1 .2 2.2 1.5 3.5.7.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></svg> {{LABEL_WHY}}</b> {{WHY}}</div>
    </div>
    <div class="src"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v8l3-3 3 3V2"/><path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H19a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H6.5a1 1 0 0 1 0-5H20"/></svg> {{LABEL_SOURCE}}: <a href="{{SOURCE_URL}}" target="_blank" rel="noopener">{{SOURCE_NAME}}</a></div>
    <!-- OPTIONAL: new-categories notice. Keep only when the interest list version is newer than the one the user has seen. -->
    <div class="news"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"/><path d="M20 3v4"/><path d="M22 5h-4"/><path d="M4 17v2"/><path d="M5 18H3"/></svg> <span>{{LABEL_NEW_CATEGORIES}}</span><button data-prompt="{{PROMPT_SHOW_NEW}}">{{LABEL_SHOW_NEW}}</button></div>
    <!-- /OPTIONAL -->
    <div class="foot">
      <!-- OPTIONAL: daily setup button. Keep only if no daily scheduled task exists yet. -->
      <button class="primary" data-prompt="{{PROMPT_SETUP_DAILY}}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> {{LABEL_SETUP_DAILY}}</button>
      <!-- /OPTIONAL -->
      <button data-prompt="{{PROMPT_ANOTHER}}"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22"/><path d="m18 2 4 4-4 4"/><path d="M2 6h1.9c1.5 0 2.9.9 3.6 2.2"/><path d="M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8"/><path d="m18 14 4 4-4 4"/></svg> {{LABEL_ANOTHER}}</button>
      <a class="support" href="https://github.com/sponsors/Mura7" target="_blank" rel="noopener"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 2v2"/><path d="M14 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/><path d="M6 2v2"/></svg> {{LABEL_SUPPORT}}</a>
    </div>
  </div>
</div>

<script>

ath d=\"M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4\"/>","nature":"<path d=\"M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z\"/><path d=\"M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12\"/>","geography":"<circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20\"/><path d=\"M2 12h20\"/>","art":"<circle cx=\"13.5\" cy=\"6.5\" r=\".5\" fill=\"currentColor\"/><circle cx=\"17.5\" cy=\"10.5\" r=\".5\" fill=\"currentColor\"/><circle cx=\"8.5\" cy=\"7.5\" r=\".5\" fill=\"currentColor\"/><circle cx=\"6.5\" cy=\"12.5\" r=\".5\" fill=\"currentColor\"/><path d=\"M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z\"/>","music":"<path d=\"M9 18V5l12-2v13\"/><circle cx=\"6\" cy=\"18\" r=\"3\"/><circle cx=\"18\" cy=\"16\" r=\"3\"/>","sports":"<path d=\"M6 9H4.5a2.5 2.5 0 0 1 0-5H6\"/><path d=\"M18 9h1.5a2.5 2.5 0 0 0 0-5H18\"/><path d=\"M4 22h16\"/><path d=\"M10 14.66V17c0 .55-.47.98-.97 1.21C7.85 18.75 7 20.24 7 22\"/><path d=\"M14 14.66V17c0 .55.47.98.97 1.21C16.15 18.75 17 20.24 17 22\"/><path d=\"M18 2H6v7a6 6 0 0 0 12 0V2Z\"/>","language":"<path d=\"m5 8 6 6\"/><path d=\"m4 14 6-6 2-3\"/><path d=\"M2 5h12\"/><path d=\"M7 2h1\"/><path d=\"m22 22-5-10-5 10\"/><path d=\"M14 18h6\"/>","philosophy":"<path d=\"M7.9 20A9 9 0 1 0 4 16.1L2 22Z\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\"/><path d=\"M12 17h.01\"/>","business":"<path d=\"M16 20V4a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16\"/><rect width=\"20\" height=\"14\" x=\"2\" y=\"6\" rx=\"2\"/>","food":"<path d=\"M17 21a1 1 0 0 0 1-1v-5.35c0-.457.316-.844.727-1.041a4 4 0 0 0-2.134-7.589 5 5 0 0 0-9.186 0 4 4 0 0 0-2.134 7.588c.411.198.727.585.727 1.041V20a1 1 0 0 0 1 1Z\"/><path d=\"M6 17h12\"/>","faith":"<path d=\"M12 7v14\"/><path d=\"M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z\"/>"};
  document.querySelectorAll('.snacky [data-icon]').forEach(function (el) {
    var p = SN_ICONS[el.getAttribute('data-icon')];
    if (p && !el.querySelector(':scope > svg.ic')) el.insertAdjacentHTML('afterbegin', '<svg class="ic" width="' + (el.getAttribute('data-size') || 16) + '" height="' + (el.getAttribute('data-size') || 16) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>');
  });
  document.querySelectorAll('.snacky [data-prompt]').forEach(function (b) {
    b.addEventListener('click', function () {
      var text = b.getAttribute('data-prompt');
      if (typeof window.sendPrompt === 'function') {
        window.sendPrompt(text);
        b.disabled = true;
      } else if (navigator.clipboard) {
        navigator.clipboard.writeText(text);
        b.textContent = '📋 ' + text;
      }
    });
  });
</script>
